# AML/CTF CDD Compliance Assistant: runtime configuration.
# Any value can be overridden with an environment variable, e.g.
#   AMLRAG_OLLAMA__HOST=http://10.0.0.5:11434
#   AMLRAG_GENERATION__MODEL=llama3.1:8b   (or: amlrag eval --model llama3.1:8b)
# (double underscore separates nesting levels)

paths:
  sources_manifest: kb/sources.yaml
  raw_dir: kb/raw
  manual_dir: kb/manual
  lock_file: kb/snapshot.lock.json
  sections_file: kb/processed/sections.jsonl
  chunks_file: kb/processed/chunks.jsonl
  chroma_dir: .index/chroma
  query_log: logs/queries.db
  results_dir: results
  gold_file: data/gold/scenarios.jsonl

ollama:
  host: http://localhost:11434
  timeout_s: 240
  keep_alive: 15m

embedding:
  backend: ollama              # ollama | hash  (hash = offline, tests only)
  model: qwen3-embedding:8b    # Milestone 1 used nomic-embed-text; compare with --embedding-model nomic-embed-text
  # Each embedding model expects its own prompt format; leaving it out noticeably hurts
  # retrieval. The entry matching the model's name (before the ":") is used. Set
  # document_prefix / query_prefix here to override it for a model not listed.
  prompt_formats:
    qwen3-embedding:           # instruction on queries only (Qwen3-Embedding model card)
      document: ""
      query: "Instruct: Given a question or customer scenario from an Australian AML/CTF compliance officer, retrieve passages of AUSTRAC guidance or the AML/CTF Rules that answer it\nQuery:"
    nomic-embed-text:
      document: "search_document: "
      query: "search_query: "
    embeddinggemma:
      document: "title: none | text: "
      query: "task: search result | query: "
    mxbai-embed-large:
      document: ""
      query: "Represent this sentence for searching relevant passages: "
  batch_size: 16

generation:
  backend: ollama              # ollama | stub  (stub = offline UI/dev only, NOT real answers)
  model: qwen3.5:9b            # Milestone 1 baseline was llama3.1:8b; compare with `amlrag eval --model llama3.1:8b`
  fallback_model: qwen3.5:4b   # used by `--fast` / if latency is a problem in the live demo
  # Qwen 3.5 and Gemma 4 "think" before answering by default: much slower, and the reasoning can
  # spill into the JSON. false turns it off; models that can't think (llama3.1) ignore it.
  think: false
  temperature: 0.0
  seed: 42
  # Ollama's default context window is small (2k-4k depending on version) and
  # silently truncates the prompt. 8 sources x ~400 tokens needs more.
  num_ctx: 8192
  num_predict: 1024

chunking:
  max_words: 320
  overlap_words: 40
  min_words: 20

retrieval:
  enabled: true                # false = closed-book baseline: the model answers with no sources (eval only)
  collection: austrac_cdd
  dense_k: 20
  bm25_k: 20
  final_k: 8
  rrf_k: 60
  max_chunks_per_section: 2
  use_hybrid: true             # false = dense only (ablation baseline)
  use_fact_extraction: true    # LLM extracts scenario facts -> targeted sub-queries
  # If no retrieved chunk reaches this cosine similarity, the assistant abstains
  # without calling the generator. Similarity ranges differ between embedding
  # models, so calibrate on the unanswerable gold items after every embedder change
  # (see docs/evaluation.md). 0.30 is a deliberately low starting point: too high
  # and the assistant refuses real questions.
  min_dense_similarity: 0.30

verification:
  # Share of a reasoning point's content words that must appear in its cited
  # passages for the point to count as lexically supported.
  min_support_overlap: 0.30
  # If more than this share of reasoning points is unsupported, confidence is capped at "low".
  max_unsupported_share: 0.34
  guardrails: true
  # escalate: a mandatory ECDD trigger found in the scenario escalates the tier to
  #           "enhanced" (only when a retrieved source supports it) and marks needs_review.
  # flag:     keep the model's tier but mark needs_review with a warning.
  guardrail_mode: escalate

server:
  # Sign-in for the web app. Leave the passwords empty when only you use it on this computer.
  # Set them before sharing the app with anyone else (e.g. through a tunnel), and set them as
  # environment variables, not here, so they never end up in a shared copy of the project:
  #   AMLRAG_SERVER__PASSWORD=...           everyone signs in as `username` with this password
  #   AMLRAG_SERVER__MANAGER_PASSWORD=...   optional: only "manager" with this password sees Review gaps
  username: cdd
  password: null
  manager_password: null

query_log:
  enabled: true
  # What is stored of each question for the Review gaps view:
  #   redacted (default): emails, phones, dates, addresses, long numbers and most names masked
  #   full: stored as typed (only for test data)
  #   none: only the outcome (tier, confidence, flags) is stored, not the question
  store_text: redacted
  retention_days: 30           # rows older than this are deleted; 0 = keep forever

eval:
  judge_backend: ollama        # ollama | lexical
  judge_model: llama3.1:8b     # a different model family from the answer model, so answers aren't self-graded
  judge_think: false
  # Walert-comparable measures (Pathiyan Cherumanal et al., CHIIR 2024)
  ndcg_cutoffs: [1, 3, 5]
  rouge_stemmer: false         # true = Porter stemming as rouge-score's use_stemmer=True (needs nltk)
  bertscore:
    enabled: auto              # auto: run if `bert-score` is installed (pip install -e ".[walert]"); true: require it; false: skip
    model_type: roberta-large  # bert-score's default English model
    lang: en
    rescale_with_baseline: false
    batch_size: 16
  # Acceptance thresholds used by tests/acceptance (the "test" in Test-Driven RAG).
  thresholds:
    tier_accuracy_acceptable: 0.80
    mandatory_ecdd_recall: 1.00
    under_application_rate_max: 0.05
    retrieval_recall_at_k: 0.80
    citation_validity: 1.00
    citation_precision: 0.60
    faithfulness: 0.80
    unanswerable_abstain_rate: 0.75
    false_abstain_rate_max: 0.15
    # Swapping a customer's name or country of birth must never change the tier.
    fairness_tier_flip_rate_max: 0.0
